<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💀</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:#050505;
    cursor:crosshair;user-select:none;
  }
  #stage{position:fixed;inset:0;transform-origin:center}

  .skull{
    position:absolute;left:0;top:0;
    pointer-events:none;
    will-change:transform;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.25));
  }

  .shaking{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0)}
    10%{transform:translate(-16px,12px) rotate(-1.6deg)}
    25%{transform:translate(14px,-14px) rotate(1.6deg)}
    45%{transform:translate(-11px,-9px) rotate(-1deg)}
    65%{transform:translate(10px,12px) rotate(1deg)}
    85%{transform:translate(-7px,6px) rotate(-.5deg)}
  }

  .flash{animation:flash .28s linear}
  @keyframes flash{
    0%,100%{filter:none}
    50%{filter:invert(1) hue-rotate(180deg) saturate(3)}
  }

  .spin{animation:spinWorld 1.2s cubic-bezier(.5,-0.4,.5,1.4) both}
  @keyframes spinWorld{
    0%{transform:rotate(0) scale(1)}
    50%{transform:rotate(180deg) scale(1.35)}
    100%{transform:rotate(360deg) scale(1)}
  }
</style>
</head>
<body>

<div id="stage"></div>

<script>
/* Die zwei Bilder */
const IMGS = [
  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7L4VwnFE1SwdFcYqg6u0AhVXtxIC3aLskFSPL-z6CIA&s=10",
  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvgZO_wQLrhZZ2a0lH240xUV4aH_V82nzBI6ff_g1KAA&s=10"
];

const stage = document.getElementById("stage");
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
const skulls = [];
let t = 0;

/* ---------- Skull erzeugen ---------- */
function makeSkull(x, y, power = 1) {
  const img = document.createElement("img");
  img.className = "skull";
  img.src = IMGS[(Math.random() * IMGS.length) | 0];
  img.draggable = false;

  const size = 40 + Math.random() * 110;

  const s = {
    el: img,
    x: x ?? Math.random() * innerWidth,
    y: y ?? Math.random() * innerHeight,
    vx: (Math.random() - 0.5) * 12 * power,
    vy: (Math.random() - 0.5) * 12 * power,
    size,
    rot: Math.random() * 360,
    spin: (Math.random() - 0.5) * 5,
    phase: Math.random() * Math.PI * 2
  };

  img.style.width = size + "px";
  stage.appendChild(img);
  skulls.push(s);
  return s;
}

/* ---------- Startwelle: GANZ VIEL CHAOS ---------- */
for (let i = 0; i < 110; i++) makeSkull();

/* ---------- Maus / Touch ---------- */
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("touchmove", e => {
  const p = e.touches[0];
  mouse.x = p.clientX; mouse.y = p.clientY;
}, { passive: true });

/* ---------- Klick = Explosion ---------- */
addEventListener("pointerdown", e => {
  bonk();
  const n = 22;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    const s = makeSkull(e.clientX, e.clientY, 1);
    s.vx = Math.cos(a) * (14 + Math.random() * 18);
    s.vy = Math.sin(a) * (14 + Math.random() * 18);
    s.rot = a * 180 / Math.PI;
  }
  shake();
  if (Math.random() < 0.4) spinWorld();
});

/* ---------- Haupt-Loop ---------- */
function loop() {
  t += 0.016;

  for (const s of skulls) {
    const dx = mouse.x - s.x;
    const dy = mouse.y - s.y;
    const d  = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    const tx = -ny, ty = nx;

    if (d > 170) { s.vx += nx * 0.42; s.vy += ny * 0.42; }
    else if (d < 100) { s.vx -= nx * 0.85; s.vy -= ny * 0.85; }

    s.vx += tx * 0.24;
    s.vy += ty * 0.24;

    s.vx *= 0.93;
    s.vy *= 0.93;

    const sp = Math.hypot(s.vx, s.vy);
    const MAX = 28;
    if (sp > MAX) { s.vx = s.vx / sp * MAX; s.vy = s.vy / sp * MAX; }

    s.x += s.vx;
    s.y += s.vy;

    if (s.x < 0)            { s.x = 0;            s.vx =  Math.abs(s.vx); }
    if (s.x > innerWidth)   { s.x = innerWidth;   s.vx = -Math.abs(s.vx); }
    if (s.y < 0)            { s.y = 0;            s.vy =  Math.abs(s.vy); }
    if (s.y > innerHeight)  { s.y = innerHeight;  s.vy = -Math.abs(s.vy); }

    s.rot += s.spin + sp * 0.6;

    const stretch = Math.min(sp * 0.06, 1.3);
    const wobble  = Math.sin(t * 10 + s.phase) * 0.18;
    const sx = 1 + stretch + wobble;
    const sy = 1 / (sx || 1);
    const ang = Math.atan2(s.vy, s.vx) * 180 / Math.PI;

    s.el.style.transform =
      `translate(${s.x}px, ${s.y}px) ` +
      `translate(-50%, -50%) ` +
      `rotate(${s.rot}deg) ` +
      `rotate(${ang}deg) scale(${sx}, ${sy}) rotate(${-ang}deg)`;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Effekte ---------- */
function shake() {
  stage.classList.remove("shaking");
  void stage.offsetWidth;
  stage.classList.add("shaking");
  setTimeout(() => stage.classList.remove("shaking"), 470);
}

function spinWorld() {
  document.body.classList.remove("spin");
  void document.body.offsetWidth;
  document.body.classList.add("spin");
  setTimeout(() => document.body.classList.remove("spin"), 1300);
}

/* ---------- Zufalls-Chaos ohne Ende ---------- */
setInterval(() => shake(), 3400);

setInterval(() => {
  const s = skulls[(Math.random() * skulls.length) | 0];
  if (!s) return;
  const old = s.el.style.width;
  s.el.style.width = (s.size * (2.5 + Math.random() * 3)) + "px";
  setTimeout(() => { s.el.style.width = old; }, 220);
}, 700);

setInterval(() => {
  const s = skulls[(Math.random() * skulls.length) | 0];
  if (!s) return;
  const dir = Math.random() < 0.5 ? -1 : 1;
  s.vx = dir * (35 + Math.random() * 30);
  s.vy = (Math.random() - 0.5) * 25;
}, 900);

setInterval(() => {
  if (Math.random() < 0.35) {
    document.body.classList.add("flash");
    setTimeout(() => document.body.classList.remove("flash"), 280);
  }
}, 2200);

setInterval(() => {
  if (Math.random() < 0.25) spinWorld();
}, 6500);

/* Alle 2s: 5 neue Skulls reinspawnen */
setInterval(() => {
  for (let i = 0; i < 5; i++) {
    const s = makeSkull(
      Math.random() * innerWidth,
      Math.random() * innerHeight,
      1.5
    );
    s.vx = (Math.random() - 0.5) * 30;
    s.vy = (Math.random() - 0.5) * 30;
  }
}, 2000);

/* ---------- BONK-Sound ---------- */
let actx = null;
function bonk() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(300 + Math.random() * 700, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, actx.currentTime + 0.13);
    g.gain.setValueAtTime(0.07, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.16);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + 0.17);
  } catch (e) {}
}

/* Kontextmenü weg */
addEventListener("contextmenu", e => e.preventDefault());

/* Damit Audio nach erstem Klick startet */
addEventListener("pointerdown", () => {
  if (actx && actx.state === "suspended") actx.resume();
}, { once: true });
</script>
</body>
</html>
