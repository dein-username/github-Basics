<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💀 TROLL 💀</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:#050505;
    cursor:crosshair;user-select:none;
    font-family:'Impact','Arial Black',sans-serif;
  }
  /* Bühne – wird für den Screenshake benutzt */
  #stage{position:fixed;inset:0;transform-origin:center}

  .skull{
    position:absolute;left:0;top:0;
    pointer-events:none;
    will-change:transform;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.18)) grayscale(1) contrast(1.15);
  }

  /* Titel */
  #title{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(60px,18vw,260px);
    letter-spacing:.05em;
    color:#fff;
    pointer-events:none;
    z-index:50;
    animation:titleShake .18s infinite, hue 3s linear infinite;
    text-shadow:0 0 30px #fff, 0 0 80px #f0f;
    mix-blend-mode:difference;
  }
  @keyframes titleShake{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
    25%{transform:translate(calc(-50% + 6px),calc(-50% - 5px)) rotate(-2deg) scale(1.03)}
    50%{transform:translate(calc(-50% - 7px),calc(-50% + 4px)) rotate(2deg) scale(.97)}
    75%{transform:translate(calc(-50% + 4px),calc(-50% + 6px)) rotate(-1deg) scale(1.02)}
    100%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
  }
  @keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}

  /* Zähler */
  #counter{
    position:fixed;top:14px;left:16px;z-index:60;
    color:#0f0;font-family:monospace;font-size:16px;
    text-shadow:0 0 10px #0f0;pointer-events:none;
  }

  /* Troll-Sprüche */
  .msg{
    position:fixed;z-index:70;pointer-events:none;
    font-size:clamp(28px,7vw,90px);
    color:#fff;text-shadow:0 0 20px #f0f,0 0 60px #0ff;
    animation:msgPop 1.6s cubic-bezier(.2,1.6,.4,1) forwards;
    white-space:nowrap;
  }
  @keyframes msgPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-20deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(6deg)}
    35%{transform:translate(-50%,-50%) scale(.95) rotate(-4deg)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(2deg)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(0deg)}
  }

  /* Screenshake */
  .shaking{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0)}
    10%{transform:translate(-14px,10px) rotate(-1.5deg)}
    25%{transform:translate(12px,-12px) rotate(1.5deg)}
    45%{transform:translate(-10px,-8px) rotate(-1deg)}
    65%{transform:translate(9px,11px) rotate(1deg)}
    85%{transform:translate(-6px,5px) rotate(-.5deg)}
  }

  /* Regenbogen-Flackern */
  .flash{animation:flash .3s linear}
  @keyframes flash{
    0%,100%{filter:none}
    50%{filter:invert(1) hue-rotate(180deg)}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="title">TROLL</div>
<div id="counter">💀 0</div>

<script>
/* =========================================================
   ⚠️ WICHTIG: Speichere dein Skull-Bild als "skull.png"
   in denselben Ordner wie diese HTML-Datei.
   (Oder ändere einfach die Zeile unten.)
   ========================================================= */
const IMG_SRC = "skull.png";

/* Fallback, falls das Bild fehlt */
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<text y=".9em" font-size="88">💀</text></svg>'
);

const stage   = document.getElementById("stage");
const counter = document.getElementById("counter");

/* ---------- Setup ---------- */
const START_COUNT = 65;
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
const skulls = [];
let t = 0;
let totalSpawned = 0;

/* ---------- Skull erzeugen ---------- */
function makeSkull(x, y, power = 1) {
  const img = document.createElement("img");
  img.className = "skull";
  img.src = IMG_SRC;
  img.onerror = () => { img.onerror = null; img.src = FALLBACK; };
  img.draggable = false;

  const size = 45 + Math.random() * 95;

  const s = {
    el: img,
    x: x ?? Math.random() * innerWidth,
    y: y ?? Math.random() * innerHeight,
    vx: (Math.random() - 0.5) * 10 * power,
    vy: (Math.random() - 0.5) * 10 * power,
    size,
    rot: Math.random() * 360,
    spin: (Math.random() - 0.5) * 4,
    phase: Math.random() * Math.PI * 2
  };

  img.style.width = size + "px";
  stage.appendChild(img);
  skulls.push(s);

  totalSpawned++;
  counter.textContent = "💀 " + totalSpawned;

  return s;
}

/* ---------- Startwelle ---------- */
for (let i = 0; i < START_COUNT; i++) makeSkull();

/* ---------- Maus / Touch ---------- */
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("touchmove", e => {
  const p = e.touches[0];
  mouse.x = p.clientX; mouse.y = p.clientY;
}, { passive: true });

/* ---------- Klick = Explosion ---------- */
addEventListener("pointerdown", e => {
  bonk();
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    const s = makeSkull(e.clientX, e.clientY, 1);
    s.vx = Math.cos(a) * (12 + Math.random() * 14);
    s.vy = Math.sin(a) * (12 + Math.random() * 14);
    s.rot = a * 180 / Math.PI;
  }
  shake();
  if (Math.random() < 0.35) popMessage();
});

/* ---------- Haupt-Loop ---------- */
function loop() {
  t += 0.016;

  for (const s of skulls) {
    const dx = mouse.x - s.x;
    const dy = mouse.y - s.y;
    const d  = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    // Tangente für den Wirbel
    const tx = -ny, ty = nx;

    // Anziehen wenn weit weg, abstoßen wenn zu nah
    if (d > 170) { s.vx += nx * 0.38; s.vy += ny * 0.38; }
    else if (d < 95) { s.vx -= nx * 0.75; s.vy -= ny * 0.75; }

    // Wirbel-Bewegung
    s.vx += tx * 0.20;
    s.vy += ty * 0.20;

    // Reibung
    s.vx *= 0.94;
    s.vy *= 0.94;

    // Geschwindigkeit begrenzen
    const sp = Math.hypot(s.vx, s.vy);
    const MAX = 24;
    if (sp > MAX) { s.vx = s.vx / sp * MAX; s.vy = s.vy / sp * MAX; }

    s.x += s.vx;
    s.y += s.vy;

    // An den Rändern abprallen
    if (s.x < 0)            { s.x = 0;            s.vx =  Math.abs(s.vx); }
    if (s.x > innerWidth)   { s.x = innerWidth;   s.vx = -Math.abs(s.vx); }
    if (s.y < 0)            { s.y = 0;            s.vy =  Math.abs(s.vy); }
    if (s.y > innerHeight)  { s.y = innerHeight;  s.vy = -Math.abs(s.vy); }

    // Drehen
    s.rot += s.spin + sp * 0.5;

    /* ---- SQUASH & STRETCH ---- */
    const stretch = Math.min(sp * 0.055, 1.15);          // Streckung aus Tempo
    const wobble  = Math.sin(t * 9 + s.phase) * 0.14;    // dauerhaftes Zappeln
    const sx = 1 + stretch + wobble;
    const sy = 1 / (sx || 1);
    const ang = Math.atan2(s.vy, s.vx) * 180 / Math.PI;

    s.el.style.transform =
      `translate(${s.x}px, ${s.y}px) ` +
      `translate(-50%, -50%) ` +
      `rotate(${s.rot}deg) ` +
      `rotate(${ang}deg) scale(${sx}, ${sy}) rotate(${-ang}deg)`;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Screenshake ---------- */
function shake() {
  stage.classList.remove("shaking");
  void stage.offsetWidth;      // Reflow erzwingen → Animation startet neu
  stage.classList.add("shaking");
  setTimeout(() => stage.classList.remove("shaking"), 470);
}

/* ---------- Troll-Sprüche ---------- */
const MESSAGES = [
  "TROLLED!", "💀💀💀", "LOL", "GOTCHA!", "NOPE",
  "SKULL OVERLOAD", "HAHAHA", "U MAD?", "BOOM!", "EWIG 💀"
];

function popMessage() {
  const el = document.createElement("div");
  el.className = "msg";
  el.textContent = MESSAGES[(Math.random() * MESSAGES.length) | 0];
  el.style.left = (10 + Math.random() * 80) + "vw";
  el.style.top  = (15 + Math.random() * 70) + "vh";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

/* ---------- Zufalls-Chaos ---------- */
setInterval(() => { shake(); }, 5200);                 // regelmäßiges Wackeln
setInterval(() => { if (Math.random() < 0.6) popMessage(); }, 2600);

/* Alle 1,4 s: ein zufälliger Skull wird riesig und schrumpft wieder */
setInterval(() => {
  const s = skulls[(Math.random() * skulls.length) | 0];
  if (!s) return;
  const old = s.el.style.width;
  s.el.style.width = (s.size * (2 + Math.random() * 2.5)) + "px";
  setTimeout(() => { s.el.style.width = old; }, 220);
}, 1400);

/* Alle 2,2 s: ein Skull schießt einmal quer über den Bildschirm */
setInterval(() => {
  const s = skulls[(Math.random() * skulls.length) | 0];
  if (!s) return;
  const dir = Math.random() < 0.5 ? -1 : 1;
  s.vx = dir * (30 + Math.random() * 25);
  s.vy = (Math.random() - 0.5) * 20;
}, 2200);

/* Gelegentliches Invertier-Flackern */
setInterval(() => {
  if (Math.random() < 0.3) {
    document.body.classList.add("flash");
    setTimeout(() => document.body.classList.remove("flash"), 300);
  }
}, 4000);

/* ---------- BONK-Sound ---------- */
let actx = null;
function bonk() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(300 + Math.random() * 700, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, actx.currentTime + 0.13);
    g.gain.setValueAtTime(0.07, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.16);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + 0.17);
  } catch (e) { /* egal */ }
}

/* ---------- Kontextmenü nervt auch ---------- */
addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
